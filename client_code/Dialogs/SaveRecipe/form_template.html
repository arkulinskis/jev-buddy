<div class="ui sv-dialog">
  <anvil-component type="Label" name="heading" prop:role='["dlg-title"]'></anvil-component>
  <anvil-component type="Label" name="intro" prop:role='["fine-print", "sv-intro"]'></anvil-component>
  <div class="ui-stack">
    <label class="ui-field"><span>Title</span>
      <anvil-component type="TextBox" name="title_box"></anvil-component></label>
    <label class="ui-field"><span>Summary <em>(optional)</em></span>
      <anvil-component type="TextBox" name="summary_box" prop:placeholder="What it decides, for whom"></anvil-component></label>
    <label class="ui-field"><span>Category</span>
      <anvil-component type="DropDown" name="cat_box"></anvil-component></label>
    <div class="sv-share">
      <anvil-component type="CheckBox" name="public_box" prop:text="Share it in Community recipes"></anvil-component>
      <span class="muted small">Others see the title, state and questions, and your display name.</span>
    </div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="copy_button" prop:text="Save as a new copy" prop:role='["btn"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:role='["btn", "btn-primary", "ic-save"]'></anvil-component>
    </div>
  </div>
</div>
