metadata:
  description: 'The friendly developer guide to Jev, the AI decision model: choice, noul and score explained with code, business
    examples, a playground and a cost calculator.'
  logo_img: asset:icon-512.png
  title: 'Jev Buddy: the developer guide to the Jev decision model'
name: Jev Buddy
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=b4d51f9623\"></script>\n<!-- seo:start (APP_MAKER/seo: edit seo/apps/jevbuddy.json\
