    \ max-video-preview:-1\">\n<meta name=\"keywords\" content=\"Jev decision model, TypeSafe AI, AI classification API, LLM\
    \ alternative for decisions, typed AI answers, calibrated probabilities API, AI routing, support ticket classification,\
    \ AI cost calculator\">\n<meta name=\"author\" content=\"Arkvital\">\n<meta property=\"og:type\" content=\"website\">\n\
    <meta property=\"og:site_name\" content=\"Jev Buddy\">\n<meta property=\"og:title\" content=\"Jev Buddy: the developer\
    \ guide to the Jev decision model\">\n<meta property=\"og:description\" content=\"The friendly developer guide to Jev,\
    \ the AI decision model: choice, noul and score explained with code, business examples, a playground and a cost calculator.\"\
    >\n<meta property=\"og:locale\" content=\"en_CA\">\n<meta name=\"twitter:card\" content=\"summary\">\n<meta name=\"twitter:title\"\
    \ content=\"Jev Buddy: the developer guide to the Jev decision model\">\n<meta name=\"twitter:description\" content=\"\
    The friendly developer guide to Jev, the AI decision model: choice, noul and score explained with code, business examples,\
    \ a playground and a cost calculator.\">\n<!-- seo:end -->\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1,\
    \ viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#070b14\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=c7bff55fed\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=c7bff55fed\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n\n<!-- Prepsto feedback panel: every \"Submit feedback\" link and button opens it (it is the only feedback\
    \ channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->\n\
    <script src=\"https://prepsto.com/_/theme/widget.js\" data-prepsto=\"ntbztc7\" data-button=\"false\" data-label=\"Submit\
    \ feedback\" async></script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=3cf7887b67\">\n<script src=\"_/theme/app.js?v=aae177a1f6\"\
    ></script>\n"
package_name: Jev_Buddy
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
